[package]
name = "headlessmc-desktop"
version = "1.0.0"
description = "Desktop app for HeadlessMc Web"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
